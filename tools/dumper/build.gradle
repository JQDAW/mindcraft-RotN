// RotN data dumper: a server-side Forge 1.12.2 mod (ADR 0004). Test server only.
//
// Toolchain (pinned; see README.md "Build"):
//   JDK 8, Gradle 4.10.3 (build.sh downloads it and checks its SHA-256),
//   ForgeGradle 3.0.197, Forge 14.23.5.2860 (the pack's build), MCP mappings stable 39-1.12.
//
// Why ForgeGradle 3 and not the 2.3 the brief named: maven.minecraftforge.net no longer serves
// the ForgeGradle 2 "userdev" artifact for 14.23.5.2860 (404), only "userdev3". The official
// 14.23.5.2860 MDK (re-released 2021-12) builds with ForgeGradle 3 on Gradle 4.9. First CI trial
// with FG 2.3 (harness-ops, run 41338011357): "Could not find net.minecraftforge:forge:1.12.2-14.23.5.2860".
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '3.0.197', changing: false
    }
}

apply plugin: 'net.minecraftforge.gradle'

version = '0.1.0' // keep equal to RotnDump.VERSION (build.sh checks)
group = 'mindcraftrotn.dumper'
archivesBaseName = 'rotndump'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

minecraft {
    mappings channel: 'stable', version: '39-1.12'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand 'version': project.version
    }
}

// Reobfuscate the jar to SRG names so it runs on the real (obfuscated) server.
jar.finalizedBy('reobfJar')
