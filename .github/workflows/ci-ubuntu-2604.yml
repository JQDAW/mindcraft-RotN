# The bot's OS (ADR 0007): npm ci and npm test on Ubuntu 26.04 with Node 22 from NodeSource, on every
# pull request and every push to develop (harness-ops). It must pass before GO 2, the CX23 bootstrap.
#
# What it mirrors from deploy/cx23/bootstrap.sh setup, so a failure here is a failure on the CX23:
#   - the same apt packages setup installs, and nothing else: bootstrap.sh's SETUP_PACKAGES line, read from that
#     file, with --no-install-recommends on both sides (G4 step 0 C1, 2026-11-08: a Recommends chain here, git ->
#     openssh-client -> xauth, brought libx11-6 and libxext6, which the CX23 lacked, and gl's binding needs them). No
#     build-essential, so a native dependency (canvas, gl) that cannot use a prebuilt binary fails here as on the CX23;
#   - Node 22 from NodeSource's `nodistro` repository, with the repository key checked against the
#     fingerprint pinned in bootstrap.sh (read from that file, so the two cannot drift apart);
#   - npm ci (its postinstall runs patch-package --error-on-fail) and npm test as a non-root user,
#     as `deploy` runs npm ci on the CX23 (deploy/cx23/deploy.sh).
#   - after npm ci, every native binding (.node) must link: ldd finds every library it needs.
# The image is ubuntu:26.04, pinned by digest. The CX23's cloud image has more packages than this container, but
# not necessarily the ones a Recommends chain pulls in here: hence no recommends on either side, the one list, and
# the ldd gate.
#
# Secrets: none. No GitHub Environment, `pull_request` only (never `pull_request_target`), a
# read-only GITHUB_TOKEN, and the checkout does not keep it.
name: ci-ubuntu-2604

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-ubuntu-2604-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-ubuntu-2604:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # ubuntu:26.04, multi-arch index digest from Docker Hub (2026-11-02).
      image: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
      # An init as PID 1 that reaps orphans, as systemd does on the CX23. Without it, a killed orphan
      # stays a zombie, and the driver tests' "no process left behind" checks see it as alive.
      options: --init
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: The OS is Ubuntu 26.04
        run: |
          set -eu
          cat /etc/os-release
          grep -q '^ID=ubuntu$' /etc/os-release
          grep -q '^VERSION_ID="26.04"$' /etc/os-release
          ldd --version | head -1

      # The checkout needs git first. Both packages are on bootstrap.sh's list (checked in the next step but one), and
      # come with no recommends, so this adds nothing the full list below would not.
      - name: git and ca-certificates for the checkout (both on bootstrap.sh's list; no recommends)
        run: |
          set -eu
          apt-get update -q
          apt-get install -y -q --no-install-recommends git ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: apt packages, exactly bootstrap.sh setup's SETUP_PACKAGES (read from it), no recommends
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          pkgs=$(sed -n 's/^readonly SETUP_PACKAGES="\([a-z0-9.+ -]*\)"$/\1/p' deploy/cx23/bootstrap.sh)
          [ -n "$pkgs" ] || { echo "::error::no SETUP_PACKAGES line in deploy/cx23/bootstrap.sh"; exit 1; }
          for need in git ca-certificates; do
            case " $pkgs " in *" $need "*) ;; *) echo "::error::$need was installed for the checkout but is not on bootstrap.sh's list"; exit 1 ;; esac
          done
          echo "bootstrap.sh SETUP_PACKAGES: $pkgs"
          # shellcheck disable=SC2086 # the list splits into package names on purpose
          apt-get install -y -q --no-install-recommends $pkgs

      # Test-only: jq, which the test-server tooling's unit tests need (deploy/test-server*; it runs on
      # the PC and the test server, never on the CX23, and deploy/cx23/ does not use it). The
      # ubuntu-24.04 runner image has it. Installed AFTER npm ci and the native checks, so they see only the CX23's
      # packages.

      - name: Node 22 from NodeSource (nodistro), key fingerprint pinned in bootstrap.sh
        run: |
          set -euo pipefail
          fpr_pinned=$(sed -n 's/^readonly NODESOURCE_KEY_FPR_PINNED=\([0-9A-F]\{40\}\)$/\1/p' deploy/cx23/bootstrap.sh)
          [ -n "$fpr_pinned" ] || { echo "no pinned NodeSource fingerprint in bootstrap.sh"; exit 1; }
          key=$(mktemp)
          curl -fsSL --proto '=https' --tlsv1.2 -o "$key" https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
          fpr=$(gpg --show-keys --with-colons "$key" 2>/dev/null | awk -F: '$1 == "fpr" { print $10; exit }')
          echo "NodeSource key fingerprint: $fpr (pinned: $fpr_pinned)"
          [ "$fpr" = "$fpr_pinned" ] || { echo "the NodeSource key is not the pinned one"; exit 1; }
          mkdir -p /etc/apt/keyrings
          gpg --dearmor --yes -o /etc/apt/keyrings/nodesource.gpg "$key"
          chmod 0644 /etc/apt/keyrings/nodesource.gpg
          echo 'deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main' > /etc/apt/sources.list.d/nodesource.list
          apt-get update -q
          apt-get install -y -q --no-install-recommends nodejs
          v=$(node --version)
          echo "node $v, npm $(npm --version)"
          case $v in v22.*) ;; *) echo "node is $v, expected v22.x (ADR 0002)"; exit 1 ;; esac

      - name: A non-root user, as deploy on the CX23
        run: |
          set -eu
          useradd --create-home --shell /bin/bash ci
          chown -R ci:ci "$GITHUB_WORKSPACE"

      # canvas and gl download prebuilt binaries from GitHub's release downloads. On 2026-11-08 those answered 504 for
      # every repo (#394, #397): prebuild-install then says only "No prebuilt binaries found" and node-gyp fails on
      # pkg-config, which reads like a code or node fault. This names the outage first: a 5xx (or no answer) fails the
      # job as external; any other non-200 (e.g. a 404 after a version bump changed the file name) is only a warning,
      # and npm ci decides. The URLs follow prebuild-install's pattern for the lockfile's versions.
      - name: GitHub release downloads answer (canvas and gl prebuilds)
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          urls=$(node -e '
            const p = require("./package-lock.json").packages;
            const v = (m) => p["node_modules/" + m].version;
            const gh = "https://github.com";
            console.log(`${gh}/Automattic/node-canvas/releases/download/v${v("canvas")}/canvas-v${v("canvas")}-napi-v7-linux-x64.tar.gz`);
            console.log(`${gh}/stackgl/headless-gl/releases/download/v${v("gl")}/gl-v${v("gl")}-node-v${process.versions.modules}-linux-x64.tar.gz`);
          ')
          down=0
          for u in $urls; do
            code=$(curl -sS -o /dev/null -L -I --retry 2 --retry-delay 10 --max-time 30 -w '%{http_code}' "$u" || true)
            echo "$code $u"
            case $code in
              200) ;;
              5??|000) down=1 ;;
              *) echo "::warning::$u answered $code (not a 5xx): the probe's file name may be stale; npm ci decides" ;;
            esac
          done
          if [ "$down" = 1 ]; then
            echo "::error::GitHub release downloads are failing (5xx or no answer): an external outage, not a code or node fault. canvas and gl cannot fetch their prebuilt binaries; re-run this job once github.com/<owner>/<repo>/releases/download/ answers 200."
            exit 1
          fi

      # Each npm and node step changes to the checkout itself (#135 review nit): in a container job,
      # ${{ github.workspace }} is the HOST's path, so working-directory is not used; $GITHUB_WORKSPACE
      # inside the step is the container's.
      - name: npm ci (postinstall applies the patches; fails if one does not apply)
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          runuser -u ci -- env HOME=/home/ci npm ci --no-audit --no-fund

      # Installing is not loading: a prebuilt binary can still miss a system library at run time (#135
      # review). With only the CX23's packages, each native module must load. A missing library is
      # reported (ldd's "not found" lines) and fails the job; it is never installed here, because the
      # CX23 would not have it either.
      # What it proves (#135 review nit): each binding LINKS (the dynamic loader finds every library it
      # needs) and initialises. It does not prove that anything renders: no canvas is drawn and no GL
      # context is created (that needs a display, which the bot does not use on the CX23).
      # Every native binding must link with only the CX23's packages (G4 step 0 C1, 2026-11-08: gl's webgl.node
      # needed libX11.so.6 and libXext.so.6). ldd on every ELF .node under node_modules: any "not found" fails the
      # job, named; never installed here, because the CX23 would not have it either. Non-ELF files (another
      # platform's prebuilds) are skipped; finding no binding at all fails too (the check must not be empty).
      # bash, declared: a container job's default shell is `sh -e` (dash), which has no process substitution.
      - name: Every native binding links (ldd on every .node under node_modules)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          n=0
          bad=0
          while IFS= read -r -d '' so; do
            if [ "$(head -c 4 "$so" | od -An -c | tr -d ' ')" != '177ELF' ]; then echo "skipped (not ELF): $so"; continue; fi
            n=$((n + 1))
            missing=$(ldd "$so" 2>&1 | grep 'not found' || true)
            if [ -n "$missing" ]; then
              bad=1
              echo "::error::$so needs a library that the CX23's packages do not provide:"
              echo "$missing"
            else
              echo "links: $so"
            fi
          done < <(find node_modules -name '*.node' -type f -print0 | sort -z)
          if [ "$n" -eq 0 ]; then echo "::error::no native .node binding under node_modules: the check would prove nothing"; exit 1; fi
          echo "$n native binding(s) checked"
          exit "$bad"

      - name: The native modules load (canvas, gl) with only the CX23's packages
        run: |
          set -u
          cd "$GITHUB_WORKSPACE"
          rc=0
          for m in canvas gl; do
            if runuser -u ci -- node -e "require('$m'); console.log('$m: loads')"; then
              continue
            fi
            rc=1
            echo "::error::$m does not load on Ubuntu 26.04 with only the CX23's packages"
            find "node_modules/$m" -name '*.node' -type f | while read -r so; do
              echo "ldd $so:"
              ldd "$so" | grep 'not found' || echo "  (ldd finds no missing library)"
            done
          done
          exit $rc

      - name: Test-only tool (jq, for the test-server tooling's tests; not on the CX23)
        run: apt-get install -y -q --no-install-recommends jq

      - name: npm test (offline unit tests)
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          runuser -u ci -- env HOME=/home/ci npm test
