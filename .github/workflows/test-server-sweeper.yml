# Off-PC watchdog for disposable Hetzner test servers (harness-ops, gate G0).
#
# Every 15 minutes, deletes servers, Primary IPs and SSH keys in the TEST project that carry
# purpose=mindcraft-rotn-test and whose delete-after label (unix epoch) has passed.
# It selects only by that label; it never touches anything else (e.g. the bot's CX23, which
# is not in the test project anyway). The job fails, so GitHub notifies, if an expired
# labelled resource survives the sweep.
#
# Token: a Read & Write API token of the Hetzner TEST project, stored by the human as the secret
# HCLOUD_TOKEN of the GitHub Environment "hetzner-test-sweeper", whose deployment branches are
# limited to `develop`. A workflow edited on an agent branch cannot read it.
name: test-server-sweeper

on:
  schedule:
    # Every 15 min, at off-peak minutes on purpose. GitHub delays and drops scheduled runs when load
    # is high, and the top of the hour and :15/:30/:45 are the busiest marks: with '*/15' this
    # workflow got one scheduled run (06:30:54 UTC) in about 10 h on 2026-11-01. Keep the minutes
    # off those marks. test-server.sh up and run (run calls up) still refuse to create anything
    # unless a scheduled run succeeded within ROTN_SWEEPER_MAX_AGE_MIN (default 120).
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be deleted, delete nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-server-sweeper
  cancel-in-progress: false

jobs:
  sweep:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: hetzner-test-sweeper
    env:
      HCLOUD_VERSION: v1.70.2
      HCLOUD_SHA256: b844bd28240112b0254183ba5266d0a0f59a6167c196636936459755efb88050
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # hcloud survives a GitHub release-download outage (2026-11-08: 504s at 11:00 and 11:45 failed this sweep). The
      # pinned tarball is cached by version and checksum, and its SHA-256 is checked on EVERY run, cached or downloaded,
      # right before use; a cached copy that does not match is discarded, never used. A miss downloads with a bounded
      # retry (3 tries, 45 s each, 20 s and 40 s apart), and only a verified download is saved to the cache.
      - name: Restore the verified hcloud download (cache)
        id: hcloud-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rotn-hcloud
          key: hcloud-linux-amd64-${{ env.HCLOUD_VERSION }}-${{ env.HCLOUD_SHA256 }}

      - name: Install hcloud (pinned, checksum-verified on every run, cached, bounded retry)
        id: hcloud
        run: |
          set -euo pipefail
          dir="$HOME/.cache/rotn-hcloud"
          tgz="$dir/hcloud-linux-amd64.tar.gz"
          url="https://github.com/hetznercloud/cli/releases/download/${HCLOUD_VERSION}/hcloud-linux-amd64.tar.gz"
          verified() { echo "${HCLOUD_SHA256}  $1" | sha256sum -c --status -; }
          mkdir -p "$dir"
          if [ -f "$tgz" ] && verified "$tgz"; then
            echo "hcloud ${HCLOUD_VERSION}: the cached download matches HCLOUD_SHA256"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            if [ -f "$tgz" ]; then echo "::warning::the cached hcloud download does not match HCLOUD_SHA256: discarded, downloading"; fi
            rm -f "$tgz" "$tgz.part"
            ok=0
            for try in 1 2 3; do
              if curl -fsSL --proto '=https' --tlsv1.2 --max-time 45 -o "$tgz.part" "$url" && verified "$tgz.part"; then ok=1; break; fi
              rm -f "$tgz.part"
              if [ "$try" -lt 3 ]; then
                echo "hcloud download try $try failed (or did not match HCLOUD_SHA256); trying again in $((try * ${HCLOUD_RETRY_S:-20})) s"
                sleep "$((try * ${HCLOUD_RETRY_S:-20}))"
              fi
            done
            if [ "$ok" != 1 ]; then
              echo "::error::no verified hcloud ${HCLOUD_VERSION}: 3 downloads failed (GitHub release downloads down?) and no verified cached copy"
              exit 1
            fi
            mv "$tgz.part" "$tgz"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi
          verified "$tgz"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/bin" hcloud
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Saved right after a verified download (not in a post step), so a sweep that fails later still leaves the cache.
      - name: Save the verified hcloud download (cache)
        if: steps.hcloud.outputs.fresh == 'true' && steps.hcloud-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rotn-hcloud
          key: hcloud-linux-amd64-${{ env.HCLOUD_VERSION }}-${{ env.HCLOUD_SHA256 }}

      - name: Sweep expired labelled test resources
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          # No hcloud context on the runner: the Environment's token is the test project's.
          ROTN_HCLOUD_AUTH: env-token
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          test -n "${HCLOUD_TOKEN:-}" || { echo "::error::HCLOUD_TOKEN is not set in environment hetzner-test-sweeper"; exit 1; }
          hcloud version
          bash deploy/test-server.sh sweep $DRY_RUN
